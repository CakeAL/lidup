[package]
name = "lidup"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
winit = "0.30"
tray-icon = "0.24"
objc2 = "0.6"
objc2-app-kit = "0.3"
smappservice-rs = "0.1.3"
anyhow = "1"
signal-hook = "0.3"

[profile.release]
opt-level = 3
